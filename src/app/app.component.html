<app-navbar></app-navbar>
<div class="app-shell">
  <app-sidebar></app-sidebar>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Global Modal -->
<app-modal
  *ngIf="(isModalOpen$ | async) as isOpen"
  [isOpen]="isOpen"
  [title]="(modalConfig$ | async)?.title || 'Confirmation'"
  [message]="(modalConfig$ | async)?.message || ''"
  [confirmText]="(modalConfig$ | async)?.confirmText || 'Confirmer'"
  [cancelText]="(modalConfig$ | async)?.cancelText || 'Annuler'"
  [isDangerous]="(modalConfig$ | async)?.isDangerous || false"
  (confirm)="onModalConfirm()"
  (cancel)="onModalCancel()">
</app-modal>

<!-- Global Toast Container -->
<app-toast></app-toast>
